<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glyph Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Glyph Viewer: the pictures the Sprawler game's square map tiles are drawn from, from the sprite sheets baked by
   tools/glyph-viewer/make_glyphs.py. Two sets: every glyph of unscii-8 mcr, and the game's tile sheet itself. Filter by
   search, Unicode block and tile-sheet status; click one for its details. The block list only offers blocks that have
   a match. Nothing is stored. */
:root{
  color-scheme:dark;
  --bg:#0c0c0e;--panel:#16161a;--panel-2:#1c1c21;--edge:#2a2a31;--edge-2:#34343c;
  --ink:#e9e7e0;--muted:#888892;--faint:#5a5a63;
  --amber:#ffb000;--acc-rgb:255,176,0;--ok:#b6ff3b;--cyan:#29f0ff;
  --sans:system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-block:28px 64px;padding-inline:max(16px,4vw)}
main{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:900 clamp(28px,4vw,40px)/1.05 var(--sans);margin:0;letter-spacing:-.01em}
h1 span{color:var(--amber)}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge);border-radius:12px;padding:16px}
.bar{display:flex;gap:12px;flex-wrap:nowrap;align-items:center}
@media (max-width:1100px){.bar{flex-wrap:wrap}}
input[type=search],select{background:#0f0f12;color:var(--ink);border:1px solid var(--edge-2);border-radius:8px;padding:8px 10px;font:inherit}
input[type=search]{flex:1 1 160px;min-width:0;max-width:300px}
select{flex:0 1 240px;min-width:0}
.seg{display:flex;flex:none;border:1px solid var(--edge-2);border-radius:8px;overflow:hidden}
.seg button{background:#0f0f12;color:var(--muted);border:0;padding:8px 12px;font:inherit;cursor:pointer;border-right:1px solid var(--edge-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:rgba(var(--acc-rgb),.16);color:var(--amber)}
.count{color:var(--muted);font:13px var(--mono);margin-left:auto;flex:none;min-width:13ch;text-align:right}
.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}}
.grid{max-height:70vh;overflow:auto;padding:2px}
.rows{display:grid;grid-template-columns:repeat(var(--cols,1),1fr);gap:4px}
.cell{height:40px;display:flex;align-items:center;justify-content:center;background:#0f0f12;border:1px solid var(--edge);border-radius:6px;cursor:pointer;position:relative}
.cell:hover{border-color:var(--edge-2)}
.cell[aria-selected=true]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.cell.in::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.g{display:block;background:var(--ink)}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){.side{position:static}}
.big{display:flex;gap:10px;align-items:center;justify-content:center;background:#07070d;border:1px solid var(--edge);border-radius:10px;height:150px}
.big .g{background:var(--cyan)}
.big .small .g{background:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--faint)}dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.name{font-weight:700;overflow-wrap:anywhere}
.copy{display:flex;gap:8px;flex-wrap:wrap}
.copy button{background:#0f0f12;color:var(--ink);border:1px solid var(--edge-2);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.copy button:hover{border-color:var(--amber)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font:12px var(--mono);margin:0 4px 2px 0}
.tag.yes{background:rgba(182,255,59,.14);color:var(--ok)}
.tag.no{background:rgba(255,176,0,.12);color:var(--amber)}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:24px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Glyph <span>Viewer</span></h1>
  <div class="panel bar">
    <div class="seg" id="set" role="group" aria-label="Set"></div>
    <input type="search" id="q" aria-label="Search">
    <select id="block" aria-label="Unicode block"></select>
    <div class="seg" id="atlas" role="group" aria-label="Filter">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="in" aria-pressed="false"></button>
      <button data-v="out" aria-pressed="false"></button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="work">
    <div class="panel"><div class="grid" id="grid" role="listbox" aria-label="Characters"></div></div>
    <div class="panel side" id="side">
      <div class="big" id="big"></div>
      <div class="name" id="nm"></div>
      <dl id="info"></dl>
      <div class="copy" id="copy" hidden></div>
      <div class="hint" id="note"></div>
    </div>
  </div>
</main>
<script>
/* @include tools/glyph-viewer/glyph-data.js */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const hex = cp => cp.toString(16).toUpperCase().padStart(4, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // glyph sets get their characters, tile sets their slot; both read the same way afterwards
  const sets = GLYPH_DATA.sets.map(s => ({ ...s, items: s.items.map((it, i) => s.kind === 'tiles'
    ? { i, slot: it[0], name: it[1], cp: it[2], how: it[3], fg: it[4], bg: it[5], want: it[6] }
    : { i, cp: it[0], name: it[1], block: it[2], slot: it[3], tiles: it[4] || [], ch: String.fromCodePoint(it[0]) }) }));
  const TEXT = {
    unscii: { q: 'Search name, glyph or code', in: 'On the sheet', out: 'Not on it' },
    tiles: { q: 'Search tile name or slot' },
  };
  const state = { set: 0, q: '', block: -1, atlas: 'all', sel: -1 };
  const gstyle = document.createElement('style');
  document.head.appendChild(gstyle);
  const S = () => sets[state.set];

  function applySet(){
    const s = S(), [cw, ch] = s.cell, k = s.scale, url = s.sheet;
    gstyle.textContent = `.g{width:${cw * k}px;height:${ch * k}px;-webkit-mask-image:url(${url});mask-image:url(${url});
      -webkit-mask-size:${cw * s.cols * k}px auto;mask-size:${cw * s.cols * k}px auto;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat${s.crisp ? ';image-rendering:pixelated' : ''}}`;
    const t = TEXT[s.id], tiles = s.kind === 'tiles';
    $('q').placeholder = t.q;
    $('block').hidden = tiles; $('atlas').hidden = tiles;
    if (!tiles){ const b = $('atlas').querySelectorAll('button'); b[1].textContent = t.in; b[2].textContent = t.out; }
    $('set').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === state.set));
    state.q = ''; state.block = -1; state.atlas = 'all'; state.sel = -1; $('q').value = '';
    $('atlas').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'all'));
    $('big').replaceChildren(); $('big').style.background = ''; $('nm').textContent = 'Click ' + (tiles ? 'a tile' : 'a character');
    $('info').replaceChildren(); $('note').textContent = ''; $('copy').hidden = true;
    history.replaceState(null, '', '#' + s.id);
  }
  const glyph = (it, zoom, fg) => {
    const s = S(), [cw, ch] = s.cell, k = s.scale, n = s.kind === 'tiles' ? it.slot : it.i;
    const e = document.createElement('i'); e.className = 'g';
    const x = (n % s.cols) * cw * k, y = Math.floor(n / s.cols) * ch * k, z = s.zoom[zoom];
    e.style.cssText = `-webkit-mask-position:-${x}px -${y}px;mask-position:-${x}px -${y}px` + (z !== 1 ? `;zoom:${z}` : '') + (fg ? `;background:${fg}` : '');
    return e;
  };

  function matchRest(it){
    const s = S(), q = state.q.trim().toLowerCase();
    if (s.kind !== 'tiles'){
      if (state.atlas === 'in' && it.slot < 0) return false;
      if (state.atlas === 'out' && it.slot >= 0) return false;
    }
    if (!q) return true;
    if (s.kind === 'tiles') return /^\d+$/.test(q) ? it.slot === +q : q.split(/\s+/).every(w => it.name.toLowerCase().includes(w));
    if ([...q].length === 1 && it.ch === state.q.trim()) return true;
    const h = q.replace(/^(u\+|0x)/, '');
    if (/^[0-9a-f]{2,6}$/.test(h) && hex(it.cp).toLowerCase().includes(h)) return true;
    return q.split(/\s+/).every(w => it.name.toLowerCase().includes(w) || it.tiles?.some(t => t[1].toLowerCase().includes(w)));
  }
  // the block list offers only blocks that have a match under the current search and filter, with their counts
  function blockOptions(pool){
    const s = S(), n = new Map();
    for (const it of pool) n.set(it.block, (n.get(it.block) || 0) + 1);
    if (!n.has(state.block)) state.block = -1;
    const sel = $('block'), frag = document.createDocumentFragment();
    const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; frag.appendChild(o); };
    add(-1, `All blocks (${pool.length})`);
    s.blocks.forEach((b, i) => { if (n.has(i)) add(i, `${b} (${n.get(i)})`); });
    sel.replaceChildren(frag); sel.value = state.block;
  }
  // the grid keeps only the rows near the view in the DOM (about 25 rows), not all 3,000 glyphs. It is rebuilt only when
  // the view leaves the rows already drawn, so ordinary scrolling just moves cells that are already there.
  const GAP = 4, MINW = 34, ROWH = 40 + GAP, BUFFER = 8;
  let list = [], at = { cols: 0, first: 0, last: 0 };
  function paint(force){
    const g = $('grid'), tiles = S().kind === 'tiles';
    const cols = Math.max(1, Math.floor((g.clientWidth - 4 + GAP) / (MINW + GAP)));
    const total = Math.ceil(list.length / cols);
    const seen0 = Math.floor(g.scrollTop / ROWH), seen1 = Math.ceil((g.scrollTop + g.clientHeight) / ROWH);
    if (!force && cols === at.cols && seen0 >= at.first && seen1 <= at.last) return;
    const first = Math.max(0, seen0 - BUFFER), last = Math.min(total, seen1 + BUFFER);
    at = { cols, first, last };
    if (!list.length){ g.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
    const rows = document.createElement('div'); rows.className = 'rows';
    rows.style.cssText = `--cols:${cols};padding-top:${first * ROWH}px;padding-bottom:${Math.max(0, total - last) * ROWH}px`;
    for (const it of list.slice(first * cols, last * cols)){
      const c = document.createElement('div');
      c.className = 'cell' + (!tiles && it.slot >= 0 ? ' in' : '');
      c.dataset.i = it.i;
      c.title = tiles ? `${it.slot} ${it.name}` : `U+${hex(it.cp)} ${it.name}`;
      c.setAttribute('role', 'option'); c.setAttribute('aria-selected', it.i === state.sel);
      if (tiles) c.style.background = it.bg;
      c.appendChild(glyph(it, 0, tiles ? it.fg : '')); rows.appendChild(c);
    }
    g.replaceChildren(rows);
  }
  function render(){
    const s = S(), tiles = s.kind === 'tiles';
    const pool = s.items.filter(matchRest);
    if (!tiles) blockOptions(pool);
    list = !tiles && state.block >= 0 ? pool.filter(it => it.block === state.block) : pool;
    $('grid').scrollTop = 0;
    paint(true);
    $('count').textContent = `${list.length} of ${s.items.length}`;
  }
  let frame = 0;
  $('grid').addEventListener('scroll', () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; paint(); }); });
  new ResizeObserver(() => paint()).observe($('grid'));

  const HOW = {
    glyph: it => `Template drawn from the unscii-8 mcr glyph U+${hex(it.cp)}.`,
    fallback: it => `The game's glyph U+${hex(it.want)} isn't in unscii-8 mcr, so the template uses U+${hex(it.cp)} instead.`,
    hand: it => `unscii-8 mcr has no U+${hex(it.cp)}, so make_tiles.py draws this one by hand.`,
    edge: () => 'A desk front: one line along an edge of a walkable tile, drawn by make_tiles.py.',
  };
  function show(i){
    const s = S(), tiles = s.kind === 'tiles', it = s.items[i];
    state.sel = i;
    document.querySelectorAll('.cell[aria-selected=true]').forEach(c => c.setAttribute('aria-selected', 'false'));
    const cell = document.querySelector(`.cell[data-i="${i}"]`); if (cell) cell.setAttribute('aria-selected', 'true');
    const big = $('big'); big.style.background = tiles ? it.bg : '';
    big.replaceChildren(glyph(it, 1, tiles ? it.fg : ''));
    const sm = document.createElement('span'); sm.className = 'small'; sm.appendChild(glyph(it, 2, tiles ? it.fg : '')); big.appendChild(sm);
    $('nm').textContent = it.name;
    let copy;
    if (tiles){
      $('info').innerHTML = `<dt>Slot</dt><dd>${it.slot}</dd><dt>Colours</dt><dd>${it.fg} on ${it.bg}</dd>`
        + (it.how === 'edge' ? '' : `<dt>Drawn from</dt><dd>U+${hex(it.cp)}</dd>`);
      $('note').textContent = HOW[it.how](it);
      copy = [['Copy name', it.name], ['Copy slot', String(it.slot)]];
    } else {
      const where = it.tiles.length ? it.tiles.map(t => `<span class="tag yes" title="tile sheet slot ${t[0]}">${esc(t[1])} · ${t[0]}</span>`).join('') : '<span class="tag no">no tile</span>';
      $('info').innerHTML = `<dt>Code</dt><dd>U+${hex(it.cp)}</dd><dt>Decimal</dt><dd>${it.cp}</dd><dt>GDScript</dt><dd>0x${hex(it.cp)}</dd>`
        + `<dt>Block</dt><dd>${esc(s.blocks[it.block])}</dd><dt>Tiles</dt><dd>${where}</dd>`;
      $('note').textContent = it.tiles.length ? 'Drawn by the tile sheet: tile name and slot above.' : 'No tile draws this yet. Give a tile this glyph in core/sprawl_map.gd and run tools/make_tiles.py --template.';
      copy = [['Copy character', it.ch], ['Copy 0x… (GDScript)', '0x' + hex(it.cp)], ['Copy U+…', 'U+' + hex(it.cp)]];
    }
    const bar = $('copy'); bar.replaceChildren(); bar.hidden = false;
    for (const [label, text] of copy){
      const b = document.createElement('button'); b.textContent = label; b.dataset.t = text; bar.appendChild(b);
    }
  }
  $('grid').addEventListener('click', e => { const c = e.target.closest('.cell'); if (c) show(+c.dataset.i); });
  $('copy').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    try { navigator.clipboard.writeText(b.dataset.t); const o = b.textContent; b.textContent = 'Copied ' + b.dataset.t; setTimeout(() => b.textContent = o, 1200); } catch (_) {}
  });
  $('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('block').addEventListener('change', e => { state.block = +e.target.value; render(); });
  $('atlas').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.atlas = b.dataset.v;
    $('atlas').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  sets.forEach((s, i) => {
    const b = document.createElement('button'); b.textContent = s.name; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { state.set = i; applySet(); render(); });
    $('set').appendChild(b);
  });
  const fromHash = sets.findIndex(s => '#' + s.id === location.hash);
  state.set = Math.max(0, fromHash);
  applySet(); render();
})();
</script>
</body>
</html>
