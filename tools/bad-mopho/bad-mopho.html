const kbBar=document.getElementById('kbBar'), kbBody=document.getElementById('kbBody'), kbDock=document.getElementById('kbdDock');
(function(){
  /* ---------- bar: collapse toggle + controls ---------- */
  const tri=el('button','kbtog','<svg class="kbtri" viewBox="0 0 12 8" width="12" height="8"><path d="M1 2 L6 7 L11 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  tri.title='Show / hide the keyboard';
  const title=el('span','kbtitle','Keyboard');

  const oct=el('div','octctl');
  oct.innerHTML=`<div class="octpill"><span class="ostep" data-d="-1" title="Octave down: − or numpad /">−</span><span class="orng"></span><span class="ostep" data-d="1" title="Octave up: = or numpad *">+</span></div><span class="lbl">Octave</span>`;
  const rng=oct.querySelector('.orng');
  const updRange=()=>rng.textContent=midiName(kbBaseNote)+'-'+midiName(kbBaseNote+24);
  octUpdate=updRange; updRange();
  oct.querySelectorAll('.ostep').forEach(b=>b.onclick=()=>shiftOctave(+b.dataset.d));
  oct.title='Click − / + or scroll · arrow keys (all four) on hover · shift = ±2 octaves';
  /* wheel + arrow hover nudge for the octave pill. Wheel/up/right = +octave; down/left = -octave. Shift = ±2. */
  oct.addEventListener('wheel',e=>{ if(!wheelGate(e))return; e.preventDefault(); shiftOctave(-Math.sign(e.deltaY)*(e.shiftKey?2:1)); },{passive:false});
  let octHover=false;
  oct.addEventListener('mouseenter',()=>octHover=true);
  oct.addEventListener('mouseleave',()=>octHover=false);
  window.addEventListener('keydown',e=>{
    if(!octHover||e.ctrlKey||e.metaKey||e.altKey) return;
    if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))) return;
    const up=(e.code==='ArrowUp'||e.code==='ArrowRight'), dn=(e.code==='ArrowDown'||e.code==='ArrowLeft');
    if(!up&&!dn) return;
    e.preventDefault(); shiftOctave((up?1:-1)*(e.shiftKey?2:1));
  });

  /* velocity as a compact slider, label below */
  const vel=el('div','kbfield');
  const velRow=el('div','kbfield-row');
  const vr=el('input','kbrange');vr.type='range';vr.min=1;vr.max=127;vr.value=kbVelocity;vr.title='Note-on velocity for clicks & computer keys (wheel/arrow keys on hover; double-click to reset to 100)';
  const vv=el('span','kbfield-val',String(kbVelocity));
  const KB_VEL_DEF=100;
  const setVel=v=>{ const nv=Math.max(1,Math.min(127,v|0)); kbVelocity=nv; vr.value=nv; vv.textContent=nv; };
  vr.oninput=()=>setVel(+vr.value);
  /* wheel + arrow nudge + dblclick reset, on the whole wrapper so the affordance works without clicking first */
  const nudge=delta=>setVel(kbVelocity+delta);
  vel.addEventListener('wheel',e=>{ if(!wheelGate(e))return; e.preventDefault(); nudge(-Math.sign(e.deltaY)*(e.shiftKey?5:1)); },{passive:false});
  vel.addEventListener('dblclick',e=>{ e.preventDefault(); setVel(KB_VEL_DEF); flash('VELOCITY RESET','default = '+KB_VEL_DEF); });
  /* hover-arrow nudge: track hover state, intercept Arrow keys while hovering */
  let velHover=false;
  vel.addEventListener('mouseenter',()=>velHover=true);
  vel.addEventListener('mouseleave',()=>velHover=false);
  window.addEventListener('keydown',e=>{
    if(!velHover||e.ctrlKey||e.metaKey||e.altKey) return;
    if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))) return;
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){ e.preventDefault(); nudge(e.shiftKey?5:1); }
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ e.preventDefault(); nudge(-(e.shiftKey?5:1)); }
  });
  velRow.appendChild(vr);velRow.appendChild(vv);
  vel.appendChild(velRow);
  vel.appendChild(el('span','kbfield-lbl','Velocity'));

  /* computer-keys toggle — keyboard icon (amber on / muted off) */
  const ckeys=el('button','iconbtn kbkeys-btn on','<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8.5 16.5h7"/></svg>');
  ckeys.title='Computer keyboard plays notes (Z S X D… / Q 2 W 3…) — click to toggle';
  ckeys.onclick=()=>{const on=!ckeys.classList.contains('on');ckeys.classList.toggle('on',on);computerKeysEnabled=on;};

  /* latch — editor-side hold; most useful with the arp, but always available */
  const latch=el('div','ctl',`<div class="lswrap"><div class="switch"><div class="nub"></div></div></div><div class="klabel">Latch</div>`);
  latch.title='Latch notes so they keep sounding after you release. Re-press a latched note to drop it; toggle off to clear all. With the arpeggiator on, notes stack.';
  const lsw=latch.querySelector('.switch');
  lsw.onclick=()=>{ const on=!lsw.classList.contains('on'); lsw.classList.toggle('on',on); setLatch(on); };

  /* Push It — settings live in a right-click popover */
  const piWrap=el('div','piwrap');
  const pi=el('button','pushit','Push<br>It!');pushBtnEl=pi;
  pi.title='Push It — trigger the programmed note or sequence. Right-click for note / velocity / mode settings.';
  pi.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();pushDown();});
  ['pointerup','pointerleave'].forEach(ev=>pi.addEventListener(ev,pushUp));
  const pop=el('div','popover popup-up hidden');
  pop.appendChild(el('div','pop-title','Push It'));
  const piRow=el('div','pushgrp-row');
  piRow.appendChild(control('pushNote'));piRow.appendChild(control('pushVel'));piRow.appendChild(control('pushMode'));
  pop.appendChild(piRow);
  pi.addEventListener('contextmenu',e=>{e.preventDefault();pop.classList.toggle('hidden');});
  document.addEventListener('pointerdown',e=>{ if(!pop.classList.contains('hidden')&&!piWrap.contains(e.target)&&!(e.target.closest&&e.target.closest('.csel-menu')))pop.classList.add('hidden'); });
  piWrap.appendChild(pop);piWrap.appendChild(pi);

  /* assign-to-front-knob popup: small anchored menu listing every assignable param.
     Note: the Mopho's assignable-knob slots ALWAYS point at a real parameter (no Off state),
     so the list contains only valid targets and assignments are always live. */
  let assignPop=null;
  function openAssignPopup(slot,anchor){
    closeAssignPopup();
    const p=el('div','assign-pop'); assignPop=p;
    const head=el('div','assign-head','Assign Knob '+slot); p.appendChild(head);
    /* filter input - pinned at top, separate from scrolling list (same pattern as dropdown menus) */
    const filterWrap=el('div','assign-filter-wrap');
    const filterInp=el('input','assign-filter'); filterInp.type='text'; filterInp.placeholder='Filter…'; filterInp.spellcheck=false;
    filterWrap.appendChild(filterInp); p.appendChild(filterWrap);
    const list=el('div','assign-list'); p.appendChild(list);
    const cur=state['assign'+slot];
    // map of index -> list of OTHER knob slots that already have it assigned (so we can show "Knob N" hint badges)
    const elsewhere={};
    for(let s=1;s<=4;s++){ if(s===slot) continue; const v=state['assign'+s]; (elsewhere[v]=elsewhere[v]||[]).push(s); }
    const rows=[];                                                // each entry: {el, label, idx} - groups have idx=null
    const addRow=(label,idx,isGroup)=>{
      if(isGroup){ const g=el('div','assign-group',label); list.appendChild(g); rows.push({el:g,label,idx:null,isGroup:true}); return; }
      const r=el('div','assign-row'+(idx===cur?' sel':''));
      const lab=el('span','assign-row-label',label); r.appendChild(lab);
      if(elsewhere[idx]){                                    // already assigned to other knob(s) - hint badge so users see the duplication
        const slots=elsewhere[idx];
        const text=slots.length===1?'Knob '+slots[0]:'Knobs '+slots.join(',');
        const badge=el('span','assign-row-badge',text);
        badge.title='Also assigned to '+(slots.length===1?'knob '+slots[0]:'knobs '+slots.join(', '));
        r.appendChild(badge);
      }
      r.onclick=()=>{ setParam('assign'+slot,idx); closeAssignPopup(); };
      list.appendChild(r); rows.push({el:r,label,idx,isGroup:false});
    };
    addRow('Parameters',null,true);
    for(let v=0;v<=104;v++){ if(ASSIGN_LABELS[v]!=null) addRow(ASSIGN_LABELS[v],v,false); }
    document.body.appendChild(p);
    /* filter: hide non-matching rows; also hide groups whose every row is hidden */
    const applyFilter=()=>{
      const q=filterInp.value.trim().toLowerCase();
      let visibleSinceGroup=0, lastGroupEl=null;
      rows.forEach(rec=>{
        if(rec.isGroup){
          if(lastGroupEl) lastGroupEl.style.display=visibleSinceGroup?'':'none';
          lastGroupEl=rec.el; visibleSinceGroup=0;
          return;                                                  // group visibility decided by its members (set on next group / end)
        }
        const match=!q || rec.label.toLowerCase().includes(q);
        rec.el.style.display=match?'':'none';
        if(match) visibleSinceGroup++;
      });
      if(lastGroupEl) lastGroupEl.style.display=visibleSinceGroup?'':'none';
    };
    filterInp.addEventListener('input',applyFilter);
    filterInp.addEventListener('keydown',e=>{
      e.stopPropagation();                                          // shield the popup's outer Esc handler
      if(e.key==='Enter'){ e.preventDefault();
        const firstMatch=rows.find(r=>!r.isGroup && r.el.style.display!=='none');
        if(firstMatch){ setParam('assign'+slot,firstMatch.idx); closeAssignPopup(); }
      } else if(e.key==='Escape'){
        if(filterInp.value){ e.preventDefault(); filterInp.value=''; applyFilter(); }    // first Esc clears; second falls through to the outer Esc -> close
        else closeAssignPopup();
      }
    });
    /* anchor: above the knob, right-aligned to its right edge */
    const r=anchor.getBoundingClientRect();
    p.style.left=Math.max(8,Math.min(window.innerWidth-p.offsetWidth-8, r.right-p.offsetWidth))+'px';
    p.style.top=Math.max(8,r.top-p.offsetHeight-6)+'px';
    /* close on outside click or Esc (outside Esc is handled by the global keydown below; this one is the global close) */
    setTimeout(()=>{
      const close=e=>{ if(!p.contains(e.target)){ closeAssignPopup(); } };
      const esc=e=>{ if(e.key==='Escape'&&document.activeElement!==filterInp) closeAssignPopup(); };
      document.addEventListener('mousedown',close);
      document.addEventListener('keydown',esc);
      p._cleanup=()=>{ document.removeEventListener('mousedown',close); document.removeEventListener('keydown',esc); };
    },0);
    /* scroll current selection into view, then focus the filter so typing works immediately */
    const selRow=p.querySelector('.assign-row.sel'); if(selRow) selRow.scrollIntoView({block:'center'});
    /* filter input is NOT auto-focused - click it to start typing */
  }
  function closeAssignPopup(){ if(assignPop){ if(assignPop._cleanup) assignPop._cleanup(); assignPop.remove(); assignPop=null; } }

  /* Front Knobs — 4 assignable knobs wired to the synth's NRPN 105-108 assignable-parameter slots.
     The slots ALWAYS hold a valid assign-table index (0-183), so the knob is always live; no "unset" state. */
  const fkBar=el('div','fkbar'); fkBar.id='fkBar';
  const fkSync=[null,null,null,null];      // per-slot re-render hooks (kept for completeness; the patch-load -> assignN -> render chain already covers refresh)
  function buildFrontKnob(slot){
    const idx=slot-1;
    const k=el('div','knob kside','<div class="dial-wrap"><div class="dial"></div><div class="dial-cap"></div><div class="ind"></div></div><div class="klabel">---------</div><div class="kval">---</div>');
    const dialWrap=k.querySelector('.dial-wrap'), ind=k.querySelector('.ind'), klab=k.querySelector('.klabel'), kval=k.querySelector('.kval');
    let curPid=null, curUnsub=null;
    const render=()=>{
      const pid=getAssignedPid(slot);
      if(pid===curPid) return;                                     // assignment unchanged -> nothing to rebind
      if(curUnsub){ curUnsub(); curUnsub=null; }                   // drop the old param's subscription (now that onChange returns a real unsubscribe)
      curPid=pid;
      if(!pid){ klab.textContent='?'.padEnd(9); kval.textContent='---'; return; }   // safety only (should never happen — assign index 0 is "Osc 1 Freq")
      k.dataset.pid=pid;                                           // global shift+click and dblclick reset gestures work via [data-pid]
      const refresh=()=>{
        const p=P[pid]; if(!p) return;
        const aIdx=state['assign'+slot];                          // current assignment index
        const shortLab=SHORT_LABEL[aIdx]||(p.label||pid);          // abbreviated for display; fall back to full label
        const fullLab=ASSIGN_LABELS[aIdx]||(p.label||pid);         // full canonical name for tooltip
        klab.textContent=shortLab;
        const curVal=fmtVal(pid,state[pid]);
        kval.textContent=curVal;
        k.title=fullLab+' = '+curVal;                              // value (formatted) so abbreviated front-knob readouts can be expanded by hovering
        const v=state[pid], t=(v-p.min)/(p.max-p.min||1);          // value -> dial rotation (-135deg..+135deg)
        ind.style.transform='rotate('+(-135+t*270)+'deg)';
      };
      refresh();
      curUnsub=onChange(pid,refresh);
    };
    fkSync[idx]=render;
    onChange('assign'+slot,render);
    render();
    /* drag-to-change (ns-resize) */
    dialWrap.style.cursor='ns-resize';
    let dragging=false, sy=0, sv=0;
    dialWrap.addEventListener('pointerdown',e=>{
      if(!curPid||e.button!==0) return;
      dragging=true; sy=e.clientY; sv=state[curPid]; dialWrap.setPointerCapture(e.pointerId);
    });
    dialWrap.addEventListener('pointermove',e=>{
      if(!dragging||!curPid) return;
      const p=P[curPid]; if(!p) return;
      // base sensitivity: full range maps to ~180px drag. For small ranges (toggles, tiny enums)
      // bump up so a flip happens within ~8px - keeps on/off knobs feeling responsive.
      const sens=Math.max((p.max-p.min)/180,1/8)*(e.shiftKey?0.25:1);
      setParam(curPid,sv+(sy-e.clientY)*sens);
    });
    dialWrap.addEventListener('pointerup',()=>dragging=false);
    /* mouse-wheel nudge when hovered */
    dialWrap.addEventListener('wheel',e=>{
      if(!curPid) return;
      const p=P[curPid]; if(!p) return;
      e.preventDefault();
      const step=e.shiftKey?5:1, nv=Math.max(p.min,Math.min(p.max,state[curPid]-Math.sign(e.deltaY)*step));
      setParam(curPid,nv);
    },{passive:false});
    /* right-click on the knob -> assign popup; left-click on the label -> same (more discoverable) */
    k.addEventListener('contextmenu',e=>{ e.preventDefault(); e.stopPropagation(); openAssignPopup(slot,k); });
    klab.style.cursor='pointer';
    klab.title='Click to assign this knob';
    klab.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); openAssignPopup(slot,k); });
    return k;
  }
  for(let s=1;s<=4;s++) fkBar.appendChild(buildFrontKnob(s));

  /* Two-row layout:
       top    = collapse triangle + "Keyboard" title + computer-keys toggle (right)
       bottom = [wheels spacer with LATCH centered] [oct + vel on left ... knobs + Push It on right] */
  ckeys.classList.add('ckeys-top');
  const topRow=el('div','kbbarTop');
  topRow.appendChild(tri); topRow.appendChild(title); topRow.appendChild(ckeys);
  const botRow=el('div','kbbarBot');
  const zWheels=el('div','zone-wheels'); zWheels.appendChild(latch);    // latch centered over the bend/mod wheels column below
  const zKeys=el('div','zone-keys');
  const zLeft=el('div','zone-left'); zLeft.appendChild(oct); zLeft.appendChild(vel);
  const zRight=el('div','zone-right'); zRight.appendChild(fkBar); zRight.appendChild(piWrap);
  zKeys.appendChild(zLeft); zKeys.appendChild(zRight);                  // explicit left + right groups, space-between keeps them at the column's edges
  botRow.appendChild(zWheels); botRow.appendChild(zKeys);
  kbBar.appendChild(topRow); kbBar.appendChild(botRow);
  /* legacy buildFrontKnobs() removed — knobs now live directly on the bar */

  /* ---------- body: piano ---------- */
  const WHITES=[0,2,4,5,7,9,11,12,14,16,17,19,21,23,24], BLACKS=[1,3,6,8,10,13,15,18,20,22];
  const wL={0:'z',2:'x',4:'c',5:'v',7:'b',9:'n',11:'m',12:'q',14:'w',16:'e',17:'r',19:'t',21:'y',23:'u',24:'i'};
  const bL={1:'s',3:'d',6:'g',8:'h',10:'j',13:'2',15:'3',18:'5',20:'6',22:'7'};
  const keys=el('div','keys'), wW=100/WHITES.length;
  function wireKey(k,off){
    k.addEventListener('pointerdown',e=>{e.preventDefault();mouseHeld=true;mousePlay(off,true);});
    k.addEventListener('pointerenter',()=>{if(mouseHeld)mousePlay(off,false);});
  }
  WHITES.forEach(off=>{const k=el('div','wkey',`<span class="ckey">${wL[off]||''}</span><span class="nn">${NOTE[off%12]}</span>`);
    keysByOffset[off]=k;wireKey(k,off);keys.appendChild(k);});
  const bl=el('div','blacks');
  BLACKS.forEach(off=>{const leftIdx=WHITES.indexOf(off-1),center=(leftIdx+1)*wW,bw=wW*0.62;
    const k=el('div','bkey',`<span class="ckey">${bL[off]||''}</span>`);
    k.style.left=`calc(${center}% - ${bw/2}%)`;k.style.width=`${bw}%`;
    keysByOffset[off]=k;wireKey(k,off);bl.appendChild(k);});
  keys.appendChild(bl);

  /* mod wheel + pitch bend, horizontal, left of the keys */
  const wheels=el('div','kbwheels');
  function makeWheel(label,bip){
    const w=el('div','kbwheel');
    const r=el('input','kbrange vert');r.type='range';
    if(bip){r.min=-8192;r.max=8191;r.value=0;} else {r.min=0;r.max=127;r.value=0;}
    w.appendChild(r);w.appendChild(el('span','kbwheel-lbl',label));wheels.appendChild(w);return r;
  }
  const pb=makeWheel('Bend',true), mw=makeWheel('Mod',false);
  const sendPB=v=>{const b=(v|0)+8192;if(midiOut)midiOutSend([0xE0|(midiChannel-1),b&0x7f,(b>>7)&0x7f]);};
  const sendMW=v=>{if(midiOut)midiOutSend([0xB0|(midiChannel-1),1,v&0x7f]);};
  pb.oninput=()=>sendPB(+pb.value);
  const pbCenter=()=>{pb.value=0;sendPB(0);};
  ['pointerup','pointercancel','keyup'].forEach(ev=>pb.addEventListener(ev,pbCenter));
  pb.title='Pitch bend — springs back to center on release';
  mw.oninput=()=>sendMW(+mw.value);
  mw.title='Mod wheel (CC 1) — double-click to reset';
  mw.addEventListener('dblclick',()=>{mw.value=0;sendMW(0);});
  mw.addEventListener('wheel',e=>{if(!wheelGate(e))return;e.preventDefault();const nv=Math.max(0,Math.min(127,(+mw.value)-Math.sign(e.deltaY)*(e.shiftKey?5:1)));mw.value=nv;sendMW(nv);},{passive:false});
  kbBody.appendChild(wheels);
  kbBody.appendChild(keys);

  /* ---------- collapse + space reservation ---------- */
  const syncPad=()=>{const h=kbDock.offsetHeight;document.documentElement.style.setProperty('--kbd-h',h+'px');document.body.style.paddingBottom=(h+20)+'px';};
  const syncWheelsWidth=()=>{const w=wheels.offsetWidth; if(w>0) zWheels.style.width=w+'px';};   // align the empty left spacer with the wheels column below so Octave starts at the piano's left edge
  const setCollapsed=c=>{kbDock.classList.toggle('collapsed',c);prefs.kbdCollapsed=c;savePrefs();syncPad();};
  tri.onclick=title.onclick=()=>setCollapsed(!kbDock.classList.contains('collapsed'));
  topRow.addEventListener('click',e=>{ if(e.target===topRow)setCollapsed(!kbDock.classList.contains('collapsed')); });
  setCollapsed(!!prefs.kbdCollapsed);
  syncPad();syncWheelsWidth();addEventListener('resize',()=>{syncPad();syncWheelsWidth();});if(window.ResizeObserver){new ResizeObserver(syncPad).observe(kbDock); new ResizeObserver(syncWheelsWidth).observe(wheels);}
})();

/* LFOs — small square shape icon (1:1) beside the dropdowns + controls */
function lfoIcon(n){
  const id='lfo'+n+'shape';
  const w=el('div','lfoicon wave-ico',`<svg viewBox="0 0 48 48" preserveAspectRatio="none"><line class="mid" x1="0" y1="24" x2="48" y2="24"/><path class="wv"></path></svg>`);
  w.title='LFO shape — click to choose, or scroll to step';
  const path=w.querySelector('.wv');
  const SH={
    0:'M6 24 L17 10 L31 38 L42 24',                               // triangle
    1:'M6 38 L6 10 L42 38',                                       // reverse saw
    2:'M6 38 L42 10 L42 38',                                      // sawtooth
    3:'M6 10 L24 10 L24 38 L42 38',                               // square
    4:'M6 30 L16 30 L16 16 L26 16 L26 34 L36 34 L36 20 L42 20'    // random (icon)
  };
  const menu=el('div','csel-menu');
  LFO_SHAPES.forEach((t,i)=>{const r=el('div','csel-opt',t);cselTap(r,()=>{setParam(id,i);closeCsel();});menu.appendChild(r);});
  document.body.appendChild(menu);
  w.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();if(_csel&&_csel.field===w){closeCsel();return;}openCselMenu(w,menu);});
  const paint=()=>{path.setAttribute('d',SH[state[id]]||SH[0]);for(let k=0;k<menu.children.length;k++)menu.children[k].classList.toggle('on',k===state[id]);};
  paint();onChange(id,paint);
  w.addEventListener('wheel',e=>{if(!wheelGate(e))return;e.preventDefault();setParam(id,state[id]+Math.sign(e.deltaY));},{passive:false});
  return w;
}

const gLfo=document.getElementById('g-lfo');
(function(){
  const p=panel('c12','');
  const r=el('div','row');r.style.cssText='align-items:stretch;flex-wrap:nowrap';

  const lfos=el('div');lfos.style.flex='1 1 0';
  lfos.appendChild(el('div','subhead','LFOs'));
  const grid2=el('div','lfo2x2');
  for(let i=0;i<4;i++){const n=i+1,b=37+i*5;
    const lp=panel('');                                  // no ptitle/dot — numbered tag on its own line
    const lhdr=el('div','lfohdr');
    const lnum=el('div','lfonum',String(n));
    lnum.title='Click to mute · right-click to solo · LFO '+n;
    lhdr.appendChild(lnum);
    lfoSync[n]=lnum;                                         // register for lfoRefresh()
    const aid='lfo'+n+'amt';
    lnum.addEventListener('click',()=>lfoToggleMute(n));
    lnum.addEventListener('contextmenu',e=>{ e.preventDefault(); lfoToggleSolo(n); });
    /* manual amount change while muted/solo-saved -> drop the saved memory (user is taking back manual control) */
    onChange(aid,()=>{
      if(lfoBtnBusy) return;
      if(lfoMuteSavedAmt[n]!=null && state[aid]!==0){ lfoMuteSavedAmt[n]=null; }
      if(lfoSoloSavedAmt[n]!=null && state[aid]!==0){ lfoSoloSavedAmt[n]=null; if(lfoSoloN===n) lfoSoloN=null; }
      lfoRefresh();
    });
    lfoRefresh();
    const fid='lfo'+n+'freq';
    const lsync=el('button','lfosync','<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>');
    lsync.title='Clock sync — when lit, the Freq knob steps through note divisions; off = free speed (0-150)';
    let lastFree=64,lastSync=159;
    const syncRefl=()=>{const v=state[fid];lsync.classList.toggle('on',v>150);if(v>150)lastSync=v;else lastFree=v;};
    syncRefl();onChange(fid,syncRefl);
    lsync.onclick=()=>setParam(fid,state[fid]>150?lastFree:lastSync);

/* Modulation Matrix — three collapsible groups showing ALL active modulation:
   (1) Mod 1-4 free slots; (2) LFOs + Env 3 (built-in modulators with their destinations
   surfaced here for at-a-glance overview); (3) Controllers (mod wheel, aftertouch, etc.).
   LFO/Env3 amount and destination are the same params edited in the Modulators section -
   changes propagate via onChange. */
(function(){
  const p=panel('c12','');
  const wrap=el('div','modwrap'),tbl=el('div','modtbl');
  ['Slot','Source','Amount','Destination'].forEach(h=>tbl.appendChild(el('div','modhd',h)));

  /* group header: a clickable row spanning all 4 columns that toggles its rows collapsed */
  const groups=[];   // [{header, rows:[el,...]}]
  function addGroup(label){
    const h=el('div','modgrp');
    h.innerHTML=`<span class="modgrp-tri"></span><span class="modgrp-lbl">${label}</span>`;
    tbl.appendChild(h);
    const g={header:h, rows:[], collapsed:false};
    h.addEventListener('click',()=>{
      g.collapsed=!g.collapsed;
      h.classList.toggle('collapsed',g.collapsed);
      g.rows.forEach(r=>r.classList.toggle('hidden',g.collapsed));
    });
    groups.push(g);
    return g;
  }
  function addRow(group,...cells){
    cells.forEach(c=>{ c.classList.add('mrow'); tbl.appendChild(c); group.rows.push(c); });
  }
  // wrap an existing element in a row cell so collapse hides it cleanly
  const cell=node=>{const w=el('div','mcell');w.appendChild(node);return w;};
  const txt=(label,extraCls)=>{const w=el('div','slotname'+(extraCls?' '+extraCls:''),label);return w;};
  const pill=(label)=>{const w=el('div','srcpill','🔒 '+label);return w;};

  /* (1) Mod 1-4 - free slots, user picks source + dest */
  const gFree=addGroup('Mod 1–4');
  for(let n=1;n<=4;n++){
    addRow(gFree, txt('Mod '+n), bareEnum('mod'+n+'src'), modSlider('mod'+n+'amt'), bareEnum('mod'+n+'dest'));
  }

  /* (2) LFOs + Env 3 - locked source pill, live amount + dest dropdowns mirroring the Modulators section */
  const gBuiltins=addGroup('LFOs + Env 3');
  for(let n=1;n<=4;n++){
    addRow(gBuiltins, txt('LFO '+n), pill('LFO '+n), modSliderU('lfo'+n+'amt'), bareEnum('lfo'+n+'dest'));
  }
  addRow(gBuiltins, txt('Env 3'), pill('Envelope 3'), modSlider('e3amt'), bareEnum('e3dest'));

  /* (3) Controllers - MIDI mods, locked source */
  const gCtl=addGroup('Controllers');
  MIDI_MODS.forEach(m=>{
    addRow(gCtl, txt(m.label), pill(m.src), modSlider(m.key+'Amt'), bareEnum(m.key+'Dest'));

  wrap.appendChild(tbl);p.appendChild(wrap);

})();

  const qaFor=pid=>e=>{ e.preventDefault(); e.stopPropagation(); if(!PID_TO_ASSIGN_IDX)buildAssignIndex(); const idx=PID_TO_ASSIGN_IDX[pid]; if(idx!=null)openQuickAssign(idx,e.clientX,e.clientY); };

    if(seqColl){seqColl.classList.remove('collapsed');requestAnimationFrame(()=>seqColl.scrollIntoView({behavior:'smooth',block:'nearest'}));}};
  paintMode();onChange('arpOn',paintMode);onChange('seqOn',paintMode);

  const top=el('div','row');top.style.alignItems='center';
  const tempoC=control('bpm');tempoC.classList.add('kside');
  /* Tempo entry: double-click the value box to type a BPM number directly. Enter commits, Esc cancels,

  {
    const klab=tempoC.querySelector('.klabel'), kval=tempoC.querySelector('.kval');
    if(klab && kval){
      kval.dataset.noDefaultReset='1';   // tells the global dblclick reset handler to skip this element
      let editing=false, outsideHandler=null;

        if(!editing) return; editing=false;
        if(outsideHandler){ document.removeEventListener('mousedown',outsideHandler,true); outsideHandler=null; }
        const inp=kval.querySelector('.tempo-inp');

          const v=parseInt(inp.value,10);
          if(!isNaN(v)) setParam('bpm',v);   // setParam fires onChange -> kval repainted with formatted value

/* ============================ Theming (HSV) ============================ */
function hsv2rgb(h,s,v){h=((h%360)+360)%360;s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
function hsv2hex(h,s,v){return '#'+hsv2rgb(h,s,v).map(n=>n.toString(16).padStart(2,'0')).join('');}

  'XC3N':  {hCtrl:171,hLcd:317,hEnv:300,hMeter:319,bh:238,bs:20,bv:15},
  'Blue Berries':{hCtrl:199,hLcd:266,hEnv:225,hMeter:242,bh:238,bs:27,bv:18}
};

/* Theme file I/O — the whole theme is the 6-key `theme` object, saved/loaded as JSON. */
function exportTheme(){
  const name=(matchPreset()==='Custom'?'mopho-theme':'mopho-theme-'+matchPreset().toLowerCase().replace(/\s+/g,'-'))+'.json';
  const json=JSON.stringify({app:'mopho-programmer',kind:'theme',version:APP_VERSION,theme:{...theme}},null,2);
  const a=document.createElement('a'),url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  flash('THEME EXPORTED',name);
}
function importTheme(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let obj; try{ obj=JSON.parse(rd.result); }catch(e){ flash('THEME IMPORT FAILED','not valid JSON'); return; }
    const t=(obj&&obj.theme)?obj.theme:obj;          // accept {theme:{...}} or a bare theme object
    const core=['hCtrl','hEnv','hMeter','bh','bs','bv'];
    if(!t||typeof t!=='object'||!core.every(k=>typeof t[k]==='number')){ flash('THEME IMPORT FAILED','missing or invalid values'); return; }
    core.forEach(k=>theme[k]=t[k]);
    theme.hLcd=(typeof t.hLcd==='number')?t.hLcd:theme.hCtrl;   // older files predate the LCD hue
    prefs.theme={...theme};savePrefs();applyTheme();
    for(const k in thmSliders){ thmSliders[k].r.value=theme[k]; thmSliders[k].val.textContent=theme[k]; }
    syncThemeSel();
    flash('THEME IMPORTED', matchPreset());
  };
  rd.onerror=()=>flash('THEME IMPORT FAILED','could not read file');
  rd.readAsText(file);
}

function applyTheme(){
  const R=document.documentElement.style, cl=(n)=>Math.max(0,Math.min(100,n)), T=theme;
  // CONTROLS role — knobs, switches, LCD, header accents (hue only; S/V fixed to the Mopho amber ramp)
  const H=T.hCtrl;
  R.setProperty('--amber',hsv2hex(H,100,100));
  R.setProperty('--acc-rgb',hsv2rgb(H,100,100).join(','));
  R.setProperty('--acc-hi',hsv2hex(H,88,100));
  R.setProperty('--acc-lo',hsv2hex(H,100,88));
  R.setProperty('--acc-dk',hsv2hex(H,100,70));
  R.setProperty('--amber-dim',hsv2hex(H,100,68));
  R.setProperty('--lcd-ink',hsv2hex(T.hLcd,60,100));
  R.setProperty('--lcd-bg',hsv2hex(T.hLcd,100,8));
  // ENVELOPES role — every ADSR/DADSR graph shares one contrasting colour
  const E=T.hEnv;
  R.setProperty('--env',hsv2hex(E,78,100));
  R.setProperty('--env-rgb',hsv2rgb(E,78,100).join(','));
  const Ef=(E-25+360)%360, E3=(E+25)%360;        // per-envelope hues: accent2 and ±25°
  R.setProperty('--env-f',hsv2hex(Ef,78,100));   R.setProperty('--env-f-rgb',hsv2rgb(Ef,78,100).join(','));   // Filter
  R.setProperty('--env-a',hsv2hex(E,78,100));    R.setProperty('--env-a-rgb',hsv2rgb(E,78,100).join(','));    // Amplifier (base accent2)
  R.setProperty('--env-3',hsv2hex(E3,78,100));   R.setProperty('--env-3-rgb',hsv2rgb(E3,78,100).join(','));   // Env 3
  // METER role — sequencer value bars + reset/data accents
  const M=T.hMeter;
  R.setProperty('--meter-hi',hsv2hex(M,75,90));
  R.setProperty('--meter-lo',hsv2hex(M,85,63));
  R.setProperty('--meter-dk',hsv2hex(M,68,22));
  R.setProperty('--meter',hsv2hex(M,75,90));
  R.setProperty('--meter-rgb',hsv2rgb(M,75,90).join(','));
  // BACKGROUND ramp
  R.setProperty('--bg',hsv2hex(T.bh,T.bs,T.bv));
  R.setProperty('--panel',hsv2hex(T.bh,T.bs,cl(T.bv+3.5)));
  R.setProperty('--panel-2',hsv2hex(T.bh,T.bs,cl(T.bv+6.5)));
  R.setProperty('--track',hsv2hex(T.bh,T.bs,cl(T.bv+11)));
  R.setProperty('--edge',hsv2hex(T.bh,T.bs,cl(T.bv+10)));
  R.setProperty('--edge-2',hsv2hex(T.bh,T.bs,cl(T.bv+15)));
  if(triSwA)triSwA.style.background=hsv2hex(H,100,100);
  if(triSwL)triSwL.style.background=hsv2hex(T.hLcd,100,100);
  if(triSwB)triSwB.style.background=hsv2hex(E,78,100);
  if(triSw3)triSw3.style.background=hsv2hex(M,62,90);
  refreshThmGradients();
}

function navLit(){ navTargets.forEach(t=>t.btn.classList.toggle('active', !t.lab.classList.contains('collapsed'))); }
function sectionInView(lab){
  const h=document.querySelector('header').offsetHeight;
  const dock=document.getElementById('kbdDock');
  const bottom=window.innerHeight-(dock?dock.offsetHeight:0);
  const r=lab.getBoundingClientRect();
  return r.top>=h-2 && r.top<=bottom-48;          // the section header sits within the visible band
}
function buildSectionNav(){
  const nav=document.getElementById('secNav'); if(!nav)return;
  nav.innerHTML=''; navTargets=[];
  document.querySelectorAll('.flowlabel').forEach(lab=>{
    const title=(lab.textContent||'').replace(/\s+/g,' ').split('·')[0].trim();
    if(!title)return;
    const b=el('button','navbtn',title);
    b.onclick=()=>{
      if(lab.classList.contains('collapsed')){ if(lab._setC)lab._setC(false); scrollToSection(lab); }  // off -> on: expand & focus
      else if(!sectionInView(lab)){ scrollToSection(lab); }                                              // on but off-screen -> go to it
      else if(lab._setC){ lab._setC(true); }                                                             // on & in view -> collapse
    };
    nav.appendChild(b);
    lab._navBtn=b;
    navTargets.push({lab,btn:b});
  });
  navLit();
}
// Each top-level section header (except the pinned Program dock) collapses its body grid(s); state persists.
function initCollapsibles(){
  const wrap=document.querySelector('.wrap'); if(!wrap)return;
  const kids=[...wrap.children];
  prefs.secCollapsed=prefs.secCollapsed||{};
  kids.forEach((node,i)=>{
    if(!node.classList||!node.classList.contains('flowlabel'))return;   // direct-child headers only (progdock's inner one is nested, so skipped)
    const body=[];
    for(let j=i+1;j<kids.length;j++){ if(kids[j].classList.contains('flowlabel'))break; body.push(kids[j]); }
    if(!body.length)return;
    const acc=node.querySelector('.accent');
    const tri=el('button','sec-tri');tri.type='button';
    tri.innerHTML='<svg viewBox="0 0 8 8" width="8" height="8"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></svg>';
    if(acc)acc.replaceWith(tri); else node.prepend(tri);
    node.classList.add('sec-head');
    const key=body[0].id||('sec'+i);
    const setC=c=>{ node.classList.toggle('collapsed',c); body.forEach(b=>b.style.display=c?'none':''); prefs.secCollapsed[key]=c; savePrefs(); navLit(); };
    node.addEventListener('click',e=>{ if(e.target.closest('select,input,a'))return; setC(!node.classList.contains('collapsed')); });
    node._expand=()=>setC(false);
    node._setC=setC;
    setC(!!prefs.secCollapsed[key]);
  });
}
initCollapsibles();
buildSectionNav();

initMIDI();
})();
</script>
