<title>Sprawler UI Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nova+Mono&family=Intel+One+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&family=VT323&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: the game screen on the left, sticky, as wide as it can be; the controls in a scrolling column on the right.
   Narrow screens: the screen sticks to the top and the controls scroll under it. */
:root{
  --bg:#07070d; --panel:#0e1020; --edge:#22264a; --ink:#c8cbe0; --muted:#7a80a8; --faint:#4a5070;
  --neon:#29f0ff; --hot:#ff2fa8; --lime:#b6ff3b;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif; --mono:"Share Tech Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font:14px/1.45 var(--mono)}
.wrap{max-width:1680px;margin:0 auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
h1 b{background:linear-gradient(90deg,var(--hot),#9d5cff 50%,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--muted);font-size:12px;flex:1 1 300px;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:14px;align-items:start}
.stage{position:sticky;top:env(safe-area-inset-top,0px);display:grid;gap:8px;min-width:0}
.screen{background:#000;border:1px solid var(--edge);border-radius:6px;padding:6px;min-width:0}
canvas{display:block;width:100%;height:auto;cursor:pointer}
.hint{font-size:12px;color:var(--faint)}
.panel{display:grid;gap:10px;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px;min-width:0;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.els{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:0;background:var(--bg);padding-bottom:6px;z-index:2}
.els button{font:12px var(--mono);color:var(--muted);background:#0a0b16;border:1px solid var(--edge);border-radius:12px;padding:3px 9px;cursor:pointer}
.els button.mod{color:var(--ink)}
.els button.mod::after{content:" •";color:var(--hot)}
.els button[aria-pressed="true"]{border-color:var(--hot);color:#fff;background:#2a0f22}
fieldset{margin:0;border:1px solid var(--edge);border-radius:6px;padding:6px 10px 9px;background:var(--panel);min-width:0;display:grid;gap:6px}
legend{padding:0 6px;font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
legend .ov{color:var(--hot);letter-spacing:0;text-transform:none;font-family:var(--mono);cursor:pointer;margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.seg button{font:13px var(--mono);color:var(--ink);background:#0a0b16;border:1px solid var(--edge);border-radius:4px;padding:3px 7px;cursor:pointer;white-space:pre}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--neon);color:var(--neon);background:#0b2230}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:1px}
label.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
input[type=range]{flex:1;min-width:0;accent-color:var(--hot)}
/* colours are swatches; a click opens VJif's colour picker (cpick.js, from VJif) */
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:22px;padding:0;border:1px solid var(--edge);border-radius:4px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}input[type=color]::-moz-color-swatch{border:0;border-radius:2px}
#cpk{position:fixed;z-index:200;width:220px;padding:8px;background:var(--panel);border:1px solid var(--muted);border-radius:6px;box-shadow:0 6px 24px #0008;font-size:12px}
#cpk .cpkTop{display:flex;gap:6px;margin-bottom:6px}#cpk .cpkSw{flex:1;border:1px solid var(--edge);border-radius:4px;height:24px}
#cpk .cpkSV,#cpk .cpkH{display:block;width:100%;border-radius:2px;cursor:crosshair;margin-bottom:5px;touch-action:none}#cpk .cpkH{height:12px;margin-bottom:7px}#cpk .cpkSV{height:104px}
#cpk .cpkHex{width:84px;font:12px var(--mono);text-transform:lowercase;color:var(--ink);background:#0a0b16;border:1px solid var(--edge);border-radius:4px;padding:2px 6px}
#cpk .field{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;align-items:center;gap:6px;margin-bottom:4px}#cpk .field label{color:var(--muted)}#cpk .field output{font-size:11px}
input[type=color].cpkOn{outline:1px solid var(--ink);outline-offset:1px}
output{font-variant-numeric:tabular-nums;color:var(--ink);min-width:4ch;text-align:right}
select{font:13px var(--mono);color:var(--ink);background:#0a0b16;border:1px solid var(--edge);border-radius:4px;padding:3px 6px;max-width:100%}
.swatch{height:8px;border-radius:2px}
.out{display:grid;gap:6px}
textarea{font:11px/1.35 var(--mono);color:var(--lime);background:#05060c;border:1px solid var(--edge);border-radius:6px;padding:6px;min-height:52px;resize:vertical;width:100%;box-sizing:border-box}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act{font:500 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#000;background:var(--neon);border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
.act.alt{background:transparent;color:var(--ink);border:1px solid var(--edge)}
#msg{font-size:12px;color:var(--lime)}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{z-index:3;background:var(--bg);padding-bottom:6px}
  .panel{max-height:none;overflow:visible}
  .els{top:0;position:static}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1><b>Sprawler</b> UI Lab</h1>
    <p>The game's 104 × 30 screen. Pick an element (or click it on the screen), change it, and watch it here. Global sets every box; a box's own changes win over Global (marked •).</p>
  </header>
  <div class="main">
    <div class="stage">
      <div class="screen"><canvas id="cv" width="1248" height="720" aria-label="Preview of the game screen with the chosen UI settings"></canvas></div>
      <div class="hint" id="hint">Click a box, a bar or the key bar to select it.</div>
    </div>
    <div class="panel">
      <div class="els" id="els" role="group" aria-label="Element to edit"></div>
      <div id="knobs" style="display:grid;gap:10px"></div>
      <div class="out">
        <textarea id="code" readonly aria-label="Settings line to send to Claude"></textarea>
        <div class="acts"><button class="act" id="copy" type="button">Copy settings</button><button class="act alt" id="reset" type="button">Back to the game's look</button><span id="msg"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ---- palette: the game's own colours (render/level_view.gd) ----
const P = { hot:'#ff2fa8', neon:'#29f0ff', lime:'#b6ff3b', amber:'#ffb627', violet:'#9d5cff', blue:'#2f7bff', red:'#ff5d5d',
  ui:'#5b6390', text:'#c8cbe0', dim:'#4a5070', wall:'#2b2f45', wallbg:'#14162a', street:'#3a3f58', streetbg:'#07070d', floor:'#4d5a66', floorbg:'#0d0f14' };
const PALETTES = {
  sprawl:  { name:'Sprawl (current)', pairs:[[P.hot,P.violet],[P.amber,P.hot],[P.neon,P.violet],[P.lime,P.neon],[P.violet,P.neon]] },
  neon:    { name:'One neon chain', chain:[P.hot,P.violet,P.blue,P.neon,P.lime,P.amber] },
  cristal: { name:'cristal', all:['#bdfff3','#4ac29a'] },
  teen:    { name:'teen', all:['#77a1d3','#79cbca','#e684ae'] },
  mind:    { name:'mind', all:['#473b7b','#3584a7','#30d2be'] },
  morning: { name:'morning', all:['#ff5f6d','#ffc371'] },
  vice:    { name:'vice', all:['#5ee7df','#b490ca'] },
  passion: { name:'passion', all:['#f43b47','#453a94'] },
  fruit:   { name:'fruit', all:['#ff4e50','#f9d423'] },
  instagram:{ name:'instagram', all:['#833ab4','#fd1d1d','#fcb045'] },
  atlas:   { name:'atlas', all:['#feac5e','#c779d0','#4bc0c8'] },
  retro:   { name:'retro', all:['#3f51b1','#5a55ae','#7b5fac','#8f6aae','#a86aa4','#cc6b8e','#f18271','#f3a469','#f7c978'] },
  summer:  { name:'summer', all:['#fdbb2d','#22c1c3'] },
  pastel:  { name:'pastel', all:['#74ebd5','#74ecd5'.replace('74ecd5','acb6e5')] },
  rainbow: { name:'rainbow', all:['#ff0000','#ff00ff','#0000ff','#00ffff','#00ff00','#ffff00','#ff0000'] },
  mono:    { name:'Mono cyan', all:[P.neon,P.neon] },
  custom:  { name:'★ My gradient (edit below)', all:null },
  ice:     { name:'Corpsec ice', all:['#2f7bff','#29f0ff','#e8f6ff'] },
  ember:   { name:'Ember', all:['#ff2fa8','#ff5d5d','#ffb627'] },
};
const BOXES = ['RUNNER','JOB','SURROUNDINGS','ROLL','COMMS'];
const BARS = ['HP','PWR','STA','FAT'];
const BAR_COLS = { HP:[P.violet,P.hot], PWR:[P.neon,P.lime], STA:[P.blue,P.neon], FAT:[P.hot,P.violet] };

// Title styles: [label, kind, left cap, right cap]. Caps are glyphs that end the frame line before the title.
const TITLES = [
  ['tab','┐TAB┌','line','┐','┌'], ['bracket','┤BRACKET├','line','┤','├'], ['half','╴HALF╶','line','╴','╶'], ['gap','─ GAP ─','line',' ',' '],
  ['tight','─TIGHT─','line','',''], ['heavy','┫HEAVY┣','line','┫','┣'], ['double','╡DOUBLE╞','line','╡','╞'], ['taper','╼TAPER╾','line','╼','╾'],
  ['square','[SQUARE]','line','[',']'], ['round','(ROUND)','line','(',')'], ['angle','‹ANGLE›','line','‹','›'], ['guill','«GUILL»','line','«','»'],
  ['dot','● DOT','pre','● ',''], ['sq','■ SQUARE','pre','■ ',''], ['small','▪ SMALL','pre','▪ ',''], ['diamond','◆ DIAMOND','pre','◆ ',''],
  ['ring','○ RING','pre','○ ',''], ['arrow','▸ ARROW','pre','▸ ',''], ['bullet','• BULLET','pre','• ',''], ['slash','// SLASH','pre','// ',''],
  ['hash','# HASH','pre','# ',''], ['num','¹NUMBER','num','',''], ['block','█BLOCK█','fill',' ',' '], ['pill','▐PILL▌','pill','▐','▌'],
  ['wedge','◀WEDGE▶','wedge','',''], ['under','UNDER (inside)','under','',''], ['none','no title','none','',''],
];
const CORNERS = [['square','┌ square'],['round','╭ rounded'],['heavy','┏ heavy'],['double','╔ double'],['mixed','╓ dbl sides'],['dashed','┄ dashed'],['blocky','▛ blocks'],['ascii','+ ascii'],['open','  corners only'],['nob','  no box']];
const BOX_DEF = { corners:'round', title:'tab', pos:'left', tcase:'upper', frame:'diag', pal:'auto', tpick:'#e8eaf6', c1:'#ff2fa8', c2:'#9d5cff', stops:null, dim:35, titleCol:'grad', bg:'none', pad:1 };
const BAR_DEF = { shape:'block', fill:'across', empty:'shade', c1:'', c2:'', width:16, label:'left' };
const KEY_DEF = { anim:'off', split:'off', seed:7, style:'chevron', k1:'#2a1745', k2:'#10283d', key:'#29f0ff', ver:'segment' };
const GLOBAL_DEF = { stops:['#ff2fa8','#9d5cff','#29f0ff'], font:'Share Tech Mono', palette:'sprawl', arrows:'prox', graph:'off', comms:'solid', glow:0, scan:0, mapbg:'#07070d', zoom:100 };
const fresh = () => ({ g:{ ...GLOBAL_DEF }, box:{ ...BOX_DEF }, bar:{ ...BAR_DEF }, key:{ ...KEY_DEF }, boxes:{}, bars:{} });
let S = fresh();
try { const v = JSON.parse(localStorage.getItem('uiLab2') || 'null'); if (v && v.g) S = { ...fresh(), ...v, g:{ ...GLOBAL_DEF, ...v.g }, box:{ ...BOX_DEF, ...v.box }, bar:{ ...BAR_DEF, ...v.bar }, key:{ ...KEY_DEF, ...v.key } }; } catch (e) {}
for (const o of [S.box, ...Object.values(S.boxes)]) if (['white','accent','c1'].includes(o.titleCol)){ o.tpick = o.titleCol === 'accent' ? '#29f0ff' : '#e8eaf6'; o.titleCol = 'pick'; }   // older settings
let SEL = 'Global';
const boxOf = id => ({ ...S.box, ...(S.boxes[id] || {}) });
const barOf = id => ({ ...S.bar, ...(S.bars[id] || {}) });

// ---- the controls ----
const $ = id => document.getElementById(id);
function seg(label, opts, get, set, isOv, clearOv){
  const fs = document.createElement('fieldset');
  fs.innerHTML = `<legend>${label}${isOv ? ' <span class="ov" title="Use Global again">• own ×</span>' : ''}</legend>`;
  if (isOv) fs.querySelector('.ov').onclick = clearOv;
  const s = document.createElement('div'); s.className = 'seg';
  for (const [v, t] of opts){ const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', get() === v);
    b.onclick = () => { set(v); changed(); }; s.append(b); }
  fs.append(s); return fs;
}
function range(label, min, max, get, set, unit, isOv, clearOv){
  const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${label}${isOv ? ' <span class="ov">• own ×</span>' : ''}</legend>`;
  if (isOv) fs.querySelector('.ov').onclick = clearOv;
  const r = document.createElement('label'); r.className = 'row'; r.innerHTML = `<input type="range" min="${min}" max="${max}" value="${get()}"><output>${get()}${unit}</output>`;
  r.querySelector('input').oninput = e => { set(+e.target.value); r.querySelector('output').textContent = e.target.value + unit; save(); draw(); };
  fs.append(r); return fs;
}
function colors(label, pairs, isOv, clearOv){
  const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${label}${isOv ? ' <span class="ov">• own ×</span>' : ''}</legend>`;
  if (isOv) fs.querySelector('.ov').onclick = clearOv;
  const r = document.createElement('div'); r.className = 'acts';
  for (const [t, get, set] of pairs){ const l = document.createElement('label'); l.className = 'row'; l.textContent = t;
    const i = document.createElement('input'); i.type = 'color'; i.value = get(); i.oninput = e => { set(e.target.value); save(); draw(); }; l.append(i); r.append(l); }
  fs.append(r); return fs;
}
function changed(){ save(); buildKnobs(); draw(); }
// A gradient made of 2 to 8 colour stops: pick each, add one, take the last off, flip the order.
function stopsEditor(label, get, set, isOv, clearOv){
  const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${label}${isOv ? ' <span class="ov">• own ×</span>' : ''}</legend>`;
  if (isOv) fs.querySelector('.ov').onclick = clearOv;
  const st = get().slice(), sw = document.createElement('div'); sw.className = 'swatch'; const paintSw = () => sw.style.background = `linear-gradient(90deg,${st.join(',')})`; paintSw();
  const row = document.createElement('div'); row.className = 'acts';
  st.forEach((c, i) => { const inp = document.createElement('input'); inp.type = 'color'; inp.value = c; inp.setAttribute('aria-label', 'Stop ' + (i+1));
    inp.oninput = e => { st[i] = e.target.value; set(st.slice()); paintSw(); save(); draw(); }; row.append(inp); });
  const btn = (t, f, dis) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'act alt'; b.textContent = t; b.disabled = dis; b.onclick = () => { f(); set(st.slice()); changed(); }; row.append(b); };
  btn('+', () => st.push(st[st.length-1]), st.length >= 8); btn('−', () => st.pop(), st.length <= 2); btn('⇄', () => st.reverse(), false);
  fs.append(sw, row); return fs;
}

function buildEls(){
  const all = ['Global', ...BOXES, ...BARS.map(b => b + ' bar'), 'Key bar'];
  $('els').innerHTML = '';
  for (const id of all){ const b = document.createElement('button'); b.type = 'button'; b.textContent = id; b.setAttribute('aria-pressed', SEL === id);
    const k = id.replace(' bar', ''); if ((S.boxes[id] && Object.keys(S.boxes[id]).length) || (S.bars[k] && Object.keys(S.bars[k]).length)) b.classList.add('mod');
    b.onclick = () => { SEL = id; buildEls(); buildKnobs(); draw(); }; $('els').append(b); }
}
function buildKnobs(){
  buildEls();
  const K = $('knobs'); K.innerHTML = '';
  const barId = SEL.replace(' bar', ''), isBox = BOXES.includes(SEL), isBar = BARS.includes(barId) && SEL.endsWith(' bar');
  if (SEL === 'Global' || isBox){
    // box knobs: Global edits the shared set, a box edits its own overrides
    const own = isBox ? (S.boxes[SEL] = S.boxes[SEL] || {}) : null;
    const get = k => isBox ? boxOf(SEL)[k] : S.box[k];
    const set = k => v => { if (isBox) own[k] = v; else S.box[k] = v; };
    const ov = k => isBox && k in own, clr = k => () => { delete own[k]; changed(); };
    if (SEL === 'Global'){
      const fs = document.createElement('fieldset'); fs.innerHTML = '<legend>Palette (auto box colours)</legend>';
      const sel = document.createElement('select'); sel.setAttribute('aria-label','Palette');
      for (const [k, p] of Object.entries(PALETTES)){ const o = document.createElement('option'); o.value = k; o.textContent = p.name; o.selected = S.g.palette === k; sel.append(o); }
      sel.onchange = e => { S.g.palette = e.target.value; changed(); };
      const sw = document.createElement('div'); sw.className = 'swatch'; const st = PALETTES[S.g.palette]; sw.style.background = `linear-gradient(90deg,${(S.g.palette === 'custom' ? S.g.stops : st.all || st.chain || st.pairs.flat()).join(',')})`;
      fs.append(sel, sw); K.append(fs);
      if (S.g.palette === 'custom') K.append(stopsEditor('My gradient (all boxes)', () => S.g.stops, v => S.g.stops = v));
    }
    K.append(seg('Title style', TITLES.map(t => [t[0], t[1]]), () => get('title'), set('title'), ov('title'), clr('title')));
    K.append(seg('Title position', [['left','left'],['center','centre'],['right','right']], () => get('pos'), set('pos'), ov('pos'), clr('pos')));
    K.append(seg('Title case', [['upper','UPPER'],['lower','lower'],['cap','Title'],['spaced','S P A C E D']], () => get('tcase'), set('tcase'), ov('tcase'), clr('tcase')));
    K.append(seg('Title colour', [['grad','gradient'],['frame','like the frame'],['pick','my colour'],['inverse','inverse']], () => get('titleCol'), set('titleCol'), ov('titleCol'), clr('titleCol')));
    if (get('titleCol') === 'pick') K.append(colors('Title colour', [['', () => get('tpick'), set('tpick')]], ov('tpick'), clr('tpick')));
    K.append(seg('Corners and lines', CORNERS, () => get('corners'), set('corners'), ov('corners'), clr('corners')));
    K.append(seg('Frame colour', [['flat','flat grey'],['solid','one colour'],['diag','gradient ↘'],['horiz','gradient →'],['vert','gradient ↓'],['ring','around the box'],['glowtop','bright top only']], () => get('frame'), set('frame'), ov('frame'), clr('frame')));
    K.append(range('Frame dim', 0, 85, () => get('dim'), v => set('dim')(v), '%', ov('dim'), clr('dim')));
    K.append(seg('Colours from', [['auto','palette'],['custom','my own gradient']], () => get('pal'), set('pal'), ov('pal'), clr('pal')));
    if (get('pal') === 'custom') K.append(stopsEditor(isBox ? SEL + ' gradient' : 'Every box: my gradient', () => get('stops') || [get('c1'), get('c2')], set('stops'), ov('stops'), clr('stops')));
    K.append(seg('Box background', [['none','black'],['tint','tinted'],['panel','panel navy'],['gradbg','soft gradient'],['stripe','top band']], () => get('bg'), set('bg'), ov('bg'), clr('bg')));
  }
  if (SEL === 'Global' || isBar){
    const own = isBar ? (S.bars[barId] = S.bars[barId] || {}) : null;
    const get = k => isBar ? barOf(barId)[k] : S.bar[k];
    const set = k => v => { if (isBar) own[k] = v; else S.bar[k] = v; };
    const ov = k => isBar && k in own, clr = k => () => { delete own[k]; changed(); };
    const t = SEL === 'Global' ? 'Bars: ' : '';
    K.append(seg(t + 'Shape', [['block','█ block'],['half','▄ half'],['low','▂ low'],['tall','▆ tall'],['left','▌ rods'],['vbar','▮ cells'],['para','▰ slants'],['meter','■ meter'],['small','▪ small'],['thin','▬ thin'],['line','━ line'],['heavy','┃ ticks'],['seg','█▏ groups of 4'],['dots','⣿ dots'],['pips','● pips'],['diamond','◆ diamonds'],['shade','▓ shade'],['chev','› chevrons'],['slash','/ slashes']], () => get('shape'), set('shape'), ov('shape'), clr('shape')));
    K.append(seg(t + 'Colour', [['solid','solid'],['across','gradient across'],['fill','gradient over fill'],['level','by level (red when low)'],['pulse','bright tip']], () => get('fill'), set('fill'), ov('fill'), clr('fill')));
    K.append(seg(t + 'Empty part', [['shade','░'],['dot','·'],['square','■ dim'],['line','─'],['low','▁'],['ghost','ghost of the colour'],['outline','outline (▯ ▱ ○ ◇ □)'],['dissolve','dissolving'],['none','none']], () => get('empty'), set('empty'), ov('empty'), clr('empty')));
    K.append(range(t + 'Width', 8, 20, () => get('width'), v => set('width')(v), '', ov('width'), clr('width')));
    K.append(seg(t + 'Numbers', [['left','label, bar, 11/17'],['pct','label, bar, 65%'],['inside','numbers on the bar'],['none','no numbers']], () => get('label'), set('label'), ov('label'), clr('label')));
    if (isBar){ const c = BAR_COLS[barId]; K.append(stopsEditor(barId + ' gradient', () => own.stops || [own.c1 || c[0], own.c2 || c[1]], v => own.stops = v, 'stops' in own, () => { delete own.stops; changed(); })); }
  }
  if (SEL === 'Global' || SEL === 'Key bar'){
    const k = S.key, set = n => v => k[n] = v;

    const hx = hsv[0] / 360 * hw; hsx.fillStyle = '#fff'; hsx.fillRect(hx - 1.5, 0, 3, hs.height); hsx.fillStyle = '#000'; hsx.fillRect(hx - 0.5, 0, 1, hs.height);
  }
  const mapDrag = (cv, fn) => { const at = e => { const r = cv.getBoundingClientRect(); fn(clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)); };
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); at(e); cv._d = true; });
    cv.addEventListener('pointermove', e => { if (cv._d) at(e); }); cv.addEventListener('pointerup', () => cv._d = false); cv.addEventListener('pointercancel', () => cv._d = false); };
  mapDrag(sv, (fx, fy) => { hsv[1] = fx * 100; hsv[2] = (1 - fy) * 100; put(hsv2rgb(hsv), true); });
  mapDrag(hs, fx => { hsv[0] = Math.min(359.9, fx * 360); put(hsv2rgb(hsv), true); });
  function put(rgb, keepHsv){
    if (!tgt) return; const hx = rgb2hex(rgb); show(rgb, keepHsv);
    if (tgt.value !== hx){ tgt.value = hx; changed = true; tgt.dispatchEvent(new Event('input', { bubbles: true })); }
  }
  el.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return; const v = +e.target.value;
    if ('hsv'.includes(k)){ hsv['hsv'.indexOf(k)] = v; put(hsv2rgb(hsv), true); }
    else { const c = hex2rgb(tgt.value); c['rgb'.indexOf(k)] = v; put(c); }
  });
  const hexIn = el.querySelector('.cpkHex');
  const hexApply = () => { let t = hexIn.value.trim().replace(/^#?/, '#'); if (/^#[0-9a-f]{3}$/i.test(t)) t = '#' + [...t.slice(1)].map(c => c + c).join('');
    if (/^#[0-9a-f]{6}$/i.test(t)) put(hex2rgb(t.toLowerCase())); else hexIn.value = tgt.value; };
  hexIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter'){ hexApply(); hexIn.blur(); } if (e.key === 'Escape'){ hexIn.value = tgt.value; hexIn.blur(); } });
  hexIn.addEventListener('blur', hexApply);
  function open(input){
    if (tgt === input) return close();
    close(); tgt = input; changed = false; el.hidden = false; show(hex2rgb(input.value));
    const r = input.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;   // under the swatch, kept on screen
    el.style.left = clamp(r.left, 6, innerWidth - w - 6) + 'px'; el.style.top = (r.bottom + h + 6 > innerHeight ? Math.max(6, r.top - h - 6) : r.bottom + 6) + 'px';
    input.classList.add('cpkOn');
  }
  function close(){
    if (!tgt) return; const t = tgt; tgt = null; el.hidden = true; t.classList.remove('cpkOn');

  const colourAt = t => t.closest && (t.closest('input[type=color]') || (t.closest('label') && t.closest('label').querySelector('input[type=color]')));
  document.addEventListener('click', e => {   // the browser's picker never opens: ours does
    const i = e.target.closest && e.target.closest('input[type=color]'); if (!i || i.disabled) return; e.preventDefault(); if (performance.now() - skipT < 800){ skipT = 0; return; } open(i); }, true);
  document.addEventListener('pointerdown', e => { if (tgt && !el.contains(e.target) && e.target !== tgt && !(e.target.closest && e.target.closest('label') && e.target.closest('label').contains(tgt))){ const o = colourAt(e.target), host = o && o.closest('[id]'), sel = o && o.dataset.i != null ? `input[type=color][data-i="${o.dataset.i}"]` : null;   // (where it is, read before closing: closing can rebuild its list)
    close();
    if (o && !o.disabled){ skipT = performance.now();   // another colour: the picker moves over to it (tweak several in a row; 0.89: also after a change, which rebuilt the list and lost it)
      requestAnimationFrame(() => { const n = o.isConnected ? o : (host && sel && host.querySelector(sel)); if (n && !n.disabled) open(n); }); } } }, true);
  addEventListener('keydown', e => { if (tgt && e.key === 'Escape' && document.activeElement !== hexIn){ e.stopPropagation(); close(); } }, true);
  return { el, open, close, get target(){ return tgt; } };
})();
// a mouse wheel over a picker slider moves it, like in VJif
cpk.el.addEventListener('wheel', e => { const r = e.target.closest('input[type=range]'); if (!r) return; e.preventDefault(); r.value = +r.value + (e.deltaY < 0 ? 1 : -1); r.dispatchEvent(new Event('input', { bubbles: true })); }, { passive: false });

buildKnobs(); save(); draw();
document.fonts && document.fonts.ready.then(draw);
