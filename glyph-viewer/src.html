<title>Glyph Viewer</title>
<style>
/* Glyph Viewer: the pictures the Sprawler game's square map tiles are drawn from, from the sprite sheets baked by
   make_glyphs.py. Two sets: every glyph of unscii-8 mcr, and the game's tile sheet itself. Filter by search, Unicode
   block and tile-sheet status; click one for its details. In the tile sheet, "Swap glyph" re-points a tile to another
   unscii glyph; swaps are kept in the artifact's database (swaps/slot-N) and Claude copies them into the game. */
:root{
  color-scheme:dark;
  --bg:#0c0c0e;--panel:#16161a;--panel-2:#1c1c21;--well:#0f0f12;--well-2:#07070d;--edge:#2a2a31;--edge-2:#34343c;
  --ink:#e9e7e0;--muted:#888892;--faint:#5a5a63;
  --amber:#ffb000;--acc-rgb:255,176,0;--ok:#b6ff3b;--cyan:#29f0ff;
  --sans:system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-block:28px 64px;padding-inline:max(16px,4vw)}
main{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:900 clamp(28px,4vw,40px)/1.05 var(--sans);margin:0;letter-spacing:-.01em}
h1 span{color:var(--amber)}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge);border-radius:12px;padding:16px}
.bar{display:flex;gap:12px;flex-wrap:nowrap;align-items:center}
@media (max-width:1100px){.bar{flex-wrap:wrap}}
input[type=search],select{background:var(--well);color:var(--ink);border:1px solid var(--edge-2);border-radius:8px;padding:8px 10px;font:inherit}
input[type=search]{flex:1 1 160px;min-width:0;max-width:300px}
select{flex:0 1 240px;min-width:0}
.seg{display:flex;flex:none;border:1px solid var(--edge-2);border-radius:8px;overflow:hidden}
.seg button{background:var(--well);color:var(--muted);border:0;padding:8px 12px;font:inherit;cursor:pointer;border-right:1px solid var(--edge-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:rgba(var(--acc-rgb),.16);color:var(--amber)}
.count{color:var(--muted);font:13px var(--mono);margin-left:auto;flex:none;min-width:13ch;text-align:right}
.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.grid{max-height:70vh;overflow:auto;padding:2px}
.rows{display:grid;grid-template-columns:repeat(var(--cols,1),1fr);gap:4px}
.cell{height:40px;display:flex;align-items:center;justify-content:center;background:var(--well);border:1px solid var(--edge);border-radius:6px;cursor:pointer;position:relative}
.cell:hover{border-color:var(--edge-2)}
.cell[aria-selected=true]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.cell.in::after,.cell.sw::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cell.sw::after{background:var(--cyan)}
.cell.sw.pend::after{background:var(--amber)}
.g{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;image-rendering:pixelated}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){.side{position:static}}
.big{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--well-2);border:1px solid var(--edge);border-radius:10px;height:150px}
.big .g{background:var(--cyan)}
.big .small .g{background:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--faint)}dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.name{font-weight:700;overflow-wrap:anywhere}
.copy,.swapbox,.foot{display:flex;gap:8px;flex-wrap:wrap}
.swapbox{flex-direction:column;align-items:stretch}
.swapbox .row{display:flex;gap:8px;flex-wrap:wrap}
.side button{background:var(--well);color:var(--ink);border:1px solid var(--edge-2);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.side button:hover{border-color:var(--amber)}
.side button.primary{border-color:var(--amber);color:var(--amber)}
.side button:disabled{opacity:.5;cursor:default}
.foot{align-items:center;justify-content:space-between;border-top:1px solid var(--edge);padding-top:10px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font:12px var(--mono);margin:0 4px 2px 0}
.tag.yes{background:rgba(182,255,59,.14);color:var(--ok)}
.tag.sw{background:rgba(41,240,255,.12);color:var(--cyan)}
.tag.no{background:rgba(255,176,0,.12);color:var(--amber)}
.hint{color:var(--muted);font-size:13px}
.hint:empty{display:none}
.fallback{width:100%;height:84px;background:var(--well);color:var(--ink);border:1px solid var(--edge-2);border-radius:8px;font:12px var(--mono);padding:6px}
.empty{color:var(--muted);padding:24px;text-align:center}
</style>
<main>
  <h1>Glyph <span>Viewer</span></h1>
  <div class="panel bar">
    <div class="seg" id="set" role="group" aria-label="Set"></div>
    <input type="search" id="q" aria-label="Search">
    <select id="block" aria-label="Unicode block"></select>
    <div class="seg" id="atlas" role="group" aria-label="Filter">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="in" aria-pressed="false"></button>
      <button data-v="out" aria-pressed="false"></button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="work">
    <div class="panel"><div class="grid" id="grid" role="listbox" aria-label="Characters"></div></div>
    <div class="panel side" id="side">
      <div class="big" id="big"></div>
      <div class="name" id="nm"></div>
      <dl id="info"></dl>
      <div class="copy" id="copy" hidden></div>
      <div class="swapbox" id="swap" hidden></div>
      <div class="hint" id="note"></div>
      <div class="foot" id="foot"><span class="hint" id="sync"></span><button id="json" hidden>Copy swaps JSON</button></div>
    </div>
  </div>
</main>
<script>
/* @include glyph-data.js */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const hex = cp => cp.toString(16).toUpperCase().padStart(4, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // glyph sets get their characters, tile sets their slot; both read the same way afterwards
  const sets = GLYPH_DATA.sets.map(s => ({ ...s, items: s.items.map((it, i) => s.kind === 'tiles'
    ? { i, slot: it[0], name: it[1], cp: it[2], how: it[3], fg: it[4], bg: it[5], want: it[6] }
    : { i, cp: it[0], name: it[1], block: it[2], slot: it[3], tiles: it[4] || [], ch: String.fromCodePoint(it[0]) }) }));
  const UNI = sets.findIndex(s => s.kind !== 'tiles'), TIL = sets.findIndex(s => s.kind === 'tiles');
  const uIndex = new Map(sets[UNI].items.map(it => [it.cp, it.i]));
  const tBySlot = new Map(sets[TIL].items.map(it => [it.slot, it]));
  const TEXT = {
    unscii: { q: 'Search name, glyph or code', in: 'On the sheet', out: 'Not on it' },
    tiles: { q: 'Search tile name or slot', in: 'Swapped', out: 'Not swapped' },
  };
  const state = { set: 0, q: '', block: -1, atlas: 'all', sel: -1 };
  // swaps: slot -> {slot, name, cp, was, at}; meta: {syncedAt, syncedVersion}; armed: the slot being re-pointed; cand: the glyph picked for it
  let db = null, canWrite = true, swaps = {}, meta = {}, armed = null, cand = null, busy = false;
  const S = () => sets[state.set];
  const swapOf = t => { const w = t && swaps[t.slot]; return w && w.cp !== t.cp && uIndex.has(w.cp) ? w : null; };
  const curCp = t => swapOf(t)?.cp ?? t.cp;
  const pending = w => !meta.syncedAt || (w.at || '') > meta.syncedAt;

  // one rule per sheet; a tile that has been swapped is drawn from the unscii sheet instead of the tile sheet
  const gstyle = document.createElement('style');
  gstyle.textContent = sets.map(s => { const [cw, ch] = s.cell, k = s.scale, url = s.sheet;
    return `.${s.kind === 'tiles' ? 'gs' : 'gu'}{width:${cw * k}px;height:${ch * k}px;-webkit-mask-image:url(${url});mask-image:url(${url});-webkit-mask-size:${cw * s.cols * k}px auto;mask-size:${cw * s.cols * k}px auto}`; }).join('\n');
  document.head.appendChild(gstyle);

  function idle(){
    const tiles = S().kind === 'tiles';
    state.sel = -1; cand = null;
    $('big').replaceChildren(); $('big').style.background = '';
    $('nm').textContent = armed != null ? `Pick a glyph for ${tBySlot.get(armed).name}` : 'Click ' + (tiles ? 'a tile' : 'a character');
    $('info').replaceChildren(); $('note').textContent = ''; $('copy').hidden = true;
    renderSwap();
  }
  function applySet(){
    const s = S(), t = TEXT[s.id], tiles = s.kind === 'tiles';
    $('q').placeholder = t.q;
    $('block').hidden = tiles;
    const b = $('atlas').querySelectorAll('button'); b[1].textContent = t.in; b[2].textContent = t.out;
    $('set').querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', i === state.set));
    state.q = ''; state.block = -1; state.atlas = 'all'; $('q').value = '';
    $('atlas').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'all'));
    idle();
    try { history.replaceState(null, '', '#' + s.id); } catch (_) {}
  }
  // kind 'u' draws unscii glyph n, 's' draws tile-sheet slot n
  const glyph = (kind, n, zoom, fg) => {
    const s = sets[kind === 'u' ? UNI : TIL], [cw, ch] = s.cell, k = s.scale;
    const e = document.createElement('i'); e.className = 'g ' + (kind === 'u' ? 'gu' : 'gs');
    const x = (n % s.cols) * cw * k, y = Math.floor(n / s.cols) * ch * k, z = s.zoom[zoom];
    e.style.cssText = `-webkit-mask-position:-${x}px -${y}px;mask-position:-${x}px -${y}px` + (z !== 1 ? `;zoom:${z}` : '') + (fg ? `;background:${fg}` : '');
    return e;
  };
  const tileGlyph = (t, zoom) => { const w = swapOf(t); return w ? glyph('u', uIndex.get(w.cp), zoom, t.fg) : glyph('s', t.slot, zoom, t.fg); };

  function matchRest(it){
    const s = S(), q = state.q.trim().toLowerCase();
    if (s.kind === 'tiles'){
      if (state.atlas === 'in' && !swapOf(it)) return false;
      if (state.atlas === 'out' && swapOf(it)) return false;
    } else {
      if (state.atlas === 'in' && it.slot < 0) return false;
      if (state.atlas === 'out' && it.slot >= 0) return false;
    }
    if (!q) return true;
    if (s.kind === 'tiles') return /^\d+$/.test(q) ? it.slot === +q : q.split(/\s+/).every(w => it.name.toLowerCase().includes(w));
    if ([...q].length === 1 && it.ch === state.q.trim()) return true;
    const h = q.replace(/^(u\+|0x)/, '');
    if (/^[0-9a-f]{2,6}$/.test(h) && hex(it.cp).toLowerCase().includes(h)) return true;
    return q.split(/\s+/).every(w => it.name.toLowerCase().includes(w) || it.tiles?.some(t => t[1].toLowerCase().includes(w)));
  }
  // the block list offers only blocks that have a match under the current search and filter, with their counts
  function blockOptions(pool){
    const s = S(), n = new Map();
    for (const it of pool) n.set(it.block, (n.get(it.block) || 0) + 1);
    if (!n.has(state.block)) state.block = -1;
    const sel = $('block'), frag = document.createDocumentFragment();
    const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; frag.appendChild(o); };
    add(-1, `All blocks (${pool.length})`);
    s.blocks.forEach((b, i) => { if (n.has(i)) add(i, `${b} (${n.get(i)})`); });
    sel.replaceChildren(frag); sel.value = state.block;
  }
  // the grid keeps only the rows near the view in the DOM (about 25 rows), not all 3,000 glyphs. It is rebuilt only when
  // the view leaves the rows already drawn, so ordinary scrolling just moves cells that are already there.
  const GAP = 4, MINW = 34, ROWH = 40 + GAP, BUFFER = 8;
  let list = [], at = { cols: 0, first: 0, last: 0 };
  const colsOf = () => Math.max(1, Math.floor(($('grid').clientWidth - 4 + GAP) / (MINW + GAP)));
  function paint(force){
    const g = $('grid'), tiles = S().kind === 'tiles';
    const cols = colsOf();
    const total = Math.ceil(list.length / cols);
    const seen0 = Math.floor(g.scrollTop / ROWH), seen1 = Math.ceil((g.scrollTop + g.clientHeight) / ROWH);
    if (!force && cols === at.cols && seen0 >= at.first && seen1 <= at.last) return;
    const first = Math.max(0, seen0 - BUFFER), last = Math.min(total, seen1 + BUFFER);
    at = { cols, first, last };
    if (!list.length){ g.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
    const rows = document.createElement('div'); rows.className = 'rows';
    rows.style.cssText = `--cols:${cols};padding-top:${first * ROWH}px;padding-bottom:${Math.max(0, total - last) * ROWH}px`;
    for (const it of list.slice(first * cols, last * cols)){
      const c = document.createElement('div'), w = tiles ? swapOf(it) : null;
      c.className = 'cell' + (!tiles && it.slot >= 0 ? ' in' : '') + (w ? ' sw' + (pending(w) ? ' pend' : '') : '');
      c.dataset.i = it.i;
      c.title = tiles ? `${it.slot} ${it.name}` + (w ? ` · swapped to U+${hex(w.cp)}` : '') : `U+${hex(it.cp)} ${it.name}`;
      c.setAttribute('role', 'option'); c.setAttribute('aria-selected', it.i === state.sel);
      if (tiles){ c.style.background = it.bg; c.appendChild(tileGlyph(it, 0)); }
      else c.appendChild(glyph('u', it.i, 0, ''));
      rows.appendChild(c);
    }
    g.replaceChildren(rows);
  }
  function refilter(){
    const s = S(), tiles = s.kind === 'tiles';
    const pool = s.items.filter(matchRest);
    if (!tiles) blockOptions(pool);
    list = !tiles && state.block >= 0 ? pool.filter(it => it.block === state.block) : pool;
    $('count').textContent = `${list.length} of ${s.items.length}`;
  }
  function render(){ refilter(); $('grid').scrollTop = 0; paint(true); }
  let frame = 0;
  $('grid').addEventListener('scroll', () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; paint(); }); });
  new ResizeObserver(() => paint()).observe($('grid'));

  const HOW = {
    glyph: it => `Template drawn from the unscii-8 mcr glyph U+${hex(it.cp)}.`,
    fallback: it => `The game's glyph U+${hex(it.want)} isn't in unscii-8 mcr, so the template uses U+${hex(it.cp)} instead.`,
    hand: it => `unscii-8 mcr has no U+${hex(it.cp)}, so make_tiles.py draws this one by hand.`,
    edge: () => 'A desk front: one line along an edge of a walkable tile, drawn by make_tiles.py.',
  };
  function show(i){
    const s = S(), tiles = s.kind === 'tiles', it = s.items[i];
    state.sel = i;
    document.querySelectorAll('.cell[aria-selected=true]').forEach(c => c.setAttribute('aria-selected', 'false'));
    const cell = document.querySelector(`.cell[data-i="${i}"]`); if (cell) cell.setAttribute('aria-selected', 'true');
    const big = $('big'), tgt = armed != null ? tBySlot.get(armed) : null;
    // while a tile is waiting for its new glyph, the picked glyph is previewed on that tile's colours
    const prev = zoom => tgt ? glyph('u', it.i, zoom, tgt.fg) : tiles ? tileGlyph(it, zoom) : glyph('u', it.i, zoom, '');
    big.style.background = tgt ? tgt.bg : tiles ? it.bg : '';
    big.replaceChildren(prev(1));
    const sm = document.createElement('span'); sm.className = 'small'; sm.appendChild(prev(2)); big.appendChild(sm);
    $('nm').textContent = it.name;
    let copy;
    if (tiles){
      const w = swapOf(it);
      $('info').innerHTML = `<dt>Slot</dt><dd>${it.slot}</dd><dt>Colours</dt><dd>${it.fg} on ${it.bg}</dd>`
        + (it.how === 'edge' ? '' : `<dt>Drawn from</dt><dd>U+${hex(it.cp)}</dd>`)
        + (w ? `<dt>Swapped to</dt><dd>U+${hex(w.cp)}</dd>` : '');
      $('note').textContent = HOW[it.how](it);
      copy = [['Copy name', it.name], ['Copy slot', String(it.slot)]];
    } else {
      const into = Object.values(swaps).filter(w => w.cp === it.cp && swapOf(tBySlot.get(w.slot))).map(w => `<span class="tag sw" title="swapped to this glyph">${esc(tBySlot.get(w.slot).name)} · ${w.slot}</span>`).join('');
      const where = it.tiles.length ? it.tiles.map(t => `<span class="tag yes" title="tile sheet slot ${t[0]}">${esc(t[1])} · ${t[0]}</span>`).join('') : '';
      $('info').innerHTML = `<dt>Code</dt><dd>U+${hex(it.cp)}</dd><dt>Decimal</dt><dd>${it.cp}</dd><dt>GDScript</dt><dd>0x${hex(it.cp)}</dd>`
        + `<dt>Block</dt><dd>${esc(s.blocks[it.block])}</dd><dt>Tiles</dt><dd>${where + into || '<span class="tag no">no tile</span>'}</dd>`;
      $('note').textContent = it.tiles.length ? 'Drawn by the tile sheet: tile name and slot above.' : 'No tile draws this yet. Swap one onto it from the tile sheet, or give a tile this glyph in core/sprawl_map.gd and run tools/make_tiles.py --template.';
      copy = [['Copy character', it.ch], ['Copy 0x… (GDScript)', '0x' + hex(it.cp)], ['Copy U+…', 'U+' + hex(it.cp)]];
    }
    if (armed != null && !tiles) cand = it.cp;
    const bar = $('copy'); bar.replaceChildren(); bar.hidden = false;
    for (const [label, text] of copy){
      const b = document.createElement('button'); b.textContent = label; b.dataset.t = text; bar.appendChild(b);
    }
    renderSwap();
  }

  // the swap controls in the side panel: arm a tile, pick a glyph, confirm or cancel, reset
  function renderSwap(){
    const box = $('swap'), tiles = S().kind === 'tiles'; box.replaceChildren();
    const msg = t => { const p = document.createElement('div'); p.className = 'hint'; p.textContent = t; box.appendChild(p); };
    const row = [], btn = (label, act, cls) => { const b = document.createElement('button'); b.textContent = label; b.dataset.act = act; b.disabled = busy; if (cls) b.className = cls; row.push(b); };
    if (armed != null){
      const t = tBySlot.get(armed);
      if (cand == null) msg(`Click a glyph in the list to try it on ${t.name}.`);
      else if (cand === curCp(t)) msg(`U+${hex(cand)} is already this tile's glyph.`);
      else { msg(`${t.name}: U+${hex(curCp(t))} → U+${hex(cand)}`); btn(cand === t.cp ? 'Back to original' : 'Confirm swap', 'confirm', 'primary'); }
      btn('Cancel', 'cancel');
    } else if (tiles && db && state.sel >= 0){
      const t = S().items[state.sel], w = swapOf(t);
      if (t.how === 'edge') msg("Desk fronts are lines the baker draws, so they can't be swapped.");
      else {
        if (w) msg(`Swapped from U+${hex(t.cp)} to U+${hex(w.cp)} · ${pending(w) ? 'not in the game yet' : 'in the game'}`);
        if (!canWrite) msg(w ? 'View only: you can\'t change swaps.' : 'View only: you can\'t swap glyphs.');
        else { btn(w ? 'Swap again…' : 'Swap glyph…', 'arm', w ? '' : 'primary'); if (w) btn(`Reset to U+${hex(t.cp)}`, 'reset'); }
      }
    }
    if (row.length){ const r = document.createElement('div'); r.className = 'row'; row.forEach(b => r.appendChild(b)); box.appendChild(r); }
    box.hidden = !box.childNodes.length;
  }
  function say(t){ $('note').textContent = t; }
  function switchSet(i){ state.set = i; applySet(); render(); }
  function reveal(slot){
    const t = tBySlot.get(slot); if (!t) return;
    const pos = list.indexOf(t); if (pos < 0) return;
    $('grid').scrollTop = Math.max(0, Math.floor(pos / colsOf()) * ROWH - 40); paint(true); show(t.i);
  }
  async function writeSwap(slot, cp){
    const t = tBySlot.get(slot), ref = db.doc('swaps/slot-' + slot);
    busy = true; renderSwap();
    try {
      if (cp === t.cp) await ref.delete();
      else await ref.set({ slot, name: t.name, cp, was: t.cp, at: new Date().toISOString() });
      busy = false; armed = null; cand = null;
      if (state.set !== TIL) switchSet(TIL);
      reveal(slot);
    } catch (_) { busy = false; renderSwap(); say('Could not save the swap. Try again.'); }
  }
  $('swap').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || busy || !db) return;
    const act = b.dataset.act;
    if (act === 'arm'){ armed = S().items[state.sel].slot; switchSet(UNI); }
    else if (act === 'cancel'){ const slot = armed; armed = null; switchSet(TIL); reveal(slot); }
    else if (act === 'confirm' && armed != null && cand != null) await writeSwap(armed, cand);
    else if (act === 'reset'){
      const t = S().items[state.sel]; busy = true; renderSwap();
      try { await db.doc('swaps/slot-' + t.slot).delete(); } catch (_) { say('Could not reset the swap. Try again.'); }
      busy = false; renderSwap();
    }
  });

  function swapsJson(){
    const rows = [...tBySlot.values()].map(t => [t, swapOf(t)]).filter(x => x[1]).map(([t, w]) => ({ slot: t.slot, name: t.name, cp: w.cp, glyph: 'U+' + hex(w.cp), was: t.cp }));
    return JSON.stringify({ version: 1, swaps: rows }, null, 2) + '\n';
  }
  function syncLine(){
    const live = [...tBySlot.values()].map(swapOf).filter(Boolean), n = live.filter(pending).length;
    $('json').hidden = !db || !live.length;
    $('sync').textContent = !db ? 'Swaps are off: open this signed in to claude.ai.'
      : !live.length ? 'No swaps yet.'
      : n ? `${n} swap${n === 1 ? '' : 's'} not in the game yet · ${live.length} in all`
      : `All ${live.length} swap${live.length === 1 ? '' : 's'} in the game (v${meta.syncedVersion || '?'})`;
  }
  // after the database changes: redraw what is on screen without losing the scroll position or the selection
  function changed(){
    syncLine();
    if (state.set === TIL){ const keep = $('grid').scrollTop; refilter(); paint(true); $('grid').scrollTop = keep; if (state.sel >= 0) show(state.sel); }
    else if (state.sel >= 0) show(state.sel); else renderSwap();
  }

  function copyText(text, b, done){
    const ok = () => { const o = b.textContent; b.textContent = done; setTimeout(() => b.textContent = o, 1200); };
    const fail = () => { const ta = document.createElement('textarea'); ta.readOnly = true; ta.className = 'fallback'; ta.value = text; $('note').replaceChildren(ta); ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (_) { fail(); }
  }
  $('grid').addEventListener('click', e => { const c = e.target.closest('.cell'); if (c) show(+c.dataset.i); });
  $('copy').addEventListener('click', e => { const b = e.target.closest('button'); if (b) copyText(b.dataset.t, b, 'Copied ' + b.dataset.t); });
  $('json').addEventListener('click', e => copyText(swapsJson(), e.currentTarget, 'Copied'));
  $('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('block').addEventListener('change', e => { state.block = +e.target.value; render(); });
  $('atlas').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.atlas = b.dataset.v;
    $('atlas').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  sets.forEach((s, i) => {
    const b = document.createElement('button'); b.textContent = s.name; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { armed = null; switchSet(i); });
    $('set').appendChild(b);
  });
  const fromHash = sets.findIndex(s => '#' + s.id === location.hash);
  state.set = Math.max(0, fromHash);
  applySet(); render(); syncLine();

  // the database lights up when it resolves; until then (or without it) the page is a plain viewer
  (async () => {
    db = await (window.claude?.use ? claude.use('db') : null);
    if (!db){ syncLine(); renderSwap(); return; }
    try { const user = await claude.use('user'); const w = user ? await user.can('data.write') : null; if (w === false) canWrite = false; } catch (_) {}
    db.doc('meta/info').onSnapshot(d => { meta = d.exists ? d.data() : {}; changed(); }, () => {});
    db.collection('swaps').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const w = d.data(); if (w && Number.isInteger(w.slot) && Number.isInteger(w.cp)) next[w.slot] = w; });
      swaps = next; changed();
    }, () => { $('sync').textContent = 'Swaps stopped updating. Reload the page.'; });
    syncLine(); renderSwap();
  })();
})();
</script>
